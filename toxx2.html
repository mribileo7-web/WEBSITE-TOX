<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOX GAMING | Official Links</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --blue: #1744ff;
    --deep: #020735;
    --yellow: #ffeb31;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: var(--deep);
    color: white;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 18px;
    overflow-x: hidden;
    position: relative;
}

/* ANIMATED BACKGROUND */

body::before {
    content: "";
    position: fixed;
    inset: -50%;
    z-index: -3;
    background:
        radial-gradient(circle at 30% 30%, #173bff 0%, transparent 25%),
        radial-gradient(circle at 70% 70%, #142080 0%, transparent 30%),
        radial-gradient(circle at 50% 50%, #08134e 0%, transparent 45%);
    animation: backgroundMove 15s ease-in-out infinite alternate;
}

@keyframes backgroundMove {
    0% { transform: translate(-5%, -4%) rotate(0deg) scale(1); }
    50% { transform: translate(5%, 3%) rotate(8deg) scale(1.12); }
    100% { transform: translate(-3%, 6%) rotate(-8deg) scale(1.05); }
}

.grid {
    position: fixed;
    inset: 0;
    z-index: -2;
    pointer-events: none;
    opacity: .1;
    background-image:
        linear-gradient(#fff 1px, transparent 1px),
        linear-gradient(90deg, #fff 1px, transparent 1px);
    background-size: 55px 55px;
    mask-image: linear-gradient(to bottom, black, transparent 90%);
}

/* LIGHT EFFECTS */

.light {
    position: fixed;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    filter: blur(110px);
    opacity: .3;
    pointer-events: none;
    z-index: -1;
    animation: lightFloat 9s ease-in-out infinite alternate;
}

.light.one {
    background: #1744ff;
    top: 5%;
    left: -100px;
}

.light.two {
    background: #ffeb31;
    bottom: 5%;
    right: -130px;
    animation-delay: -4s;
}

@keyframes lightFloat {
    to { transform: translate(80px, -60px) scale(1.3); }
}

/* PARTICLES */

.particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: -1;
}

.particles span {
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--yellow);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--yellow);
    opacity: 0;
    animation: particle 8s linear infinite;
}

.particles span:nth-child(1) { left: 10%; animation-delay: 0s; }
.particles span:nth-child(2) { left: 25%; animation-delay: 2s; }
.particles span:nth-child(3) { left: 40%; animation-delay: 4s; }
.particles span:nth-child(4) { left: 60%; animation-delay: 1s; }
.particles span:nth-child(5) { left: 75%; animation-delay: 3s; }
.particles span:nth-child(6) { left: 90%; animation-delay: 5s; }
.particles span:nth-child(7) { left: 50%; animation-delay: 6s; }

@keyframes particle {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    20% { opacity: .8; }
    80% { opacity: .6; }
    100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
}

/* MAIN */

.container {
    width: 100%;
    max-width: 420px;
    text-align: center;
    position: relative;
    animation: pageEnter 1.2s cubic-bezier(.2,.8,.2,1) both;
}

@keyframes pageEnter {
    from { opacity: 0; transform: translateY(40px) scale(.96); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

/* LOGO */

.logo-card {
    width: 155px;
    height: 155px;
    margin: 0 auto 25px;
    border: 1px solid rgba(255,235,49,.7);
    border-radius: 35px;
    background: linear-gradient(145deg, #142b96, #03082f);
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 35px rgba(255,235,49,.12);
    animation: logoFloat 4s ease-in-out infinite;
}

.logo-card::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background: linear-gradient(
        115deg,
        transparent 35%,
        rgba(255,255,255,.18) 50%,
        transparent 65%
    );
    animation: logoShine 5s ease-in-out infinite;
}

@keyframes logoFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(0deg); }
}

@keyframes logoShine {
    0%, 35% { transform: translateX(-100%) rotate(25deg); }
    75%, 100% { transform: translateX(100%) rotate(25deg); }
}

.logo-card:hover {
    animation-play-state: paused;
    box-shadow: 0 0 55px rgba(255,235,49,.3);
}

.tox-logo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    padding: 8px;
    position: relative;
    z-index: 1;
    transform: none;
}

/* BRAND */

.brand {
    font-family: 'Orbitron', sans-serif;
    font-size: 31px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 12px;
    animation: titleGlow 3s ease-in-out infinite alternate;
}

.brand .o {
    color: var(--yellow);
}

@keyframes titleGlow {
    from { text-shadow: 0 0 8px rgba(255,255,255,.1); }
    to { text-shadow: 0 0 25px rgba(65,105,255,.7); }
}

.subtitle {
    color: #c3c9ed;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
}

/* TAGS */

.tags {
    display: flex;
    justify-content: center;
    gap: 9px;
    margin: 27px 0 32px;
    flex-wrap: wrap;
}

.tag {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 9px 13px;
    border: 1px solid rgba(255,235,49,.3);
    border-radius: 5px;
    color: var(--yellow);
    background: rgba(255,235,49,.04);
    transition: .3s;
}

.tag:hover {
    background: var(--yellow);
    color: var(--deep);
    transform: translateY(-4px);
    box-shadow: 0 0 20px rgba(255,235,49,.25);
}

/* LINKS */

.links {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.link-card {
    position: relative;
    text-decoration: none;
    color: white;
    min-height: 78px;
    padding: 14px 17px;
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 14px;
    background: rgba(255,255,255,.055);
    display: flex;
    align-items: center;
    text-align: left;
    gap: 15px;
    overflow: hidden;
    backdrop-filter: blur(12px);
    transition: transform .35s, border-color .35s, box-shadow .35s;
    opacity: 0;
    animation: cardEnter .7s ease forwards;
}

.link-card:nth-child(1) { animation-delay: .3s; }
.link-card:nth-child(2) { animation-delay: .5s; }
.link-card:nth-child(3) { animation-delay: .7s; }

@keyframes cardEnter {
    from { opacity: 0; transform: translateX(-30px); }
    to { opacity: 1; transform: translateX(0); }
}

.link-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        100deg,
        transparent,
        rgba(255,255,255,.13),
        transparent
    );
    transform: translateX(-110%);
    transition: .7s;
}

.link-card:hover::before {
    transform: translateX(110%);
}

.link-card:hover {
    transform: translateY(-6px) scale(1.02);
    border-color: var(--yellow);
    box-shadow: 0 12px 35px rgba(0,0,0,.3),
                0 0 20px rgba(255,235,49,.1);
}

.icon-box {
    width: 45px;
    height: 45px;
    flex-shrink: 0;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: rgba(255,255,255,.1);
    transition: .4s;
}

.icon-box svg {
    width: 23px;
    height: 23px;
    fill: currentColor;
}

.link-card:hover .icon-box {
    transform: rotate(-10deg) scale(1.12);
    background: rgba(255,235,49,.15);
    color: var(--yellow);
}

.link-info {
    flex: 1;
}

.link-title {
    display: block;
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 4px;
}

.link-subtitle {
    font-size: 10px;
    color: #b5bde6;
    font-weight: 500;
}

.arrow {
    font-size: 22px;
    color: #aab3dc;
    transition: .3s;
}

.link-card:hover .arrow {
    color: var(--yellow);
    transform: translate(4px, -4px);
}

/* TELEGRAM */

.primary {
    background: linear-gradient(110deg, #ffed56, #ffdb20);
    color: #02084b;
    border-color: var(--yellow);
    box-shadow: 0 7px 25px rgba(255,234,49,.13);
}

.primary .icon-box {
    background: rgba(2,8,75,.1);
}

.primary .link-subtitle {
    color: #343b70;
}

.primary .arrow {
    color: #02084b;
}

.primary:hover {
    background: #fff47c;
    border-color: white;
    box-shadow: 0 10px 35px rgba(255,234,49,.25);
}

.primary:hover .icon-box {
    color: #02084b;
    background: rgba(2,8,75,.15);
}

.primary .icon-box svg {
    fill: #02084b;
}

/* FOOTER */

.footer {
    margin-top: 42px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,.12);
    animation: pageEnter 1.5s ease both;
}

.footer-brand {

    letter-spacing: 4px;

}

.footer-line {
    width: 30px;
    height: 2px;
    background: var(--yellow);
    margin: 12px auto;
    box-shadow: 0 0 12px var(--yellow);
    animation: lineGlow 2s infinite alternate;
}

@keyframes lineGlow {
    from { width: 20px; opacity: .5; }
    to { width: 60px; opacity: 1; }
}

.footer-copy {
    font-size: 9px;
    color: #737fae;
    letter-spacing: 1.5px;
}

@media (max-width: 380px) {
    .brand { font-size: 25px; }
    .logo-card { width: 140px; height: 140px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>
